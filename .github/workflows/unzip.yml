name: Auto Unzip

on:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip files
        run: |
          find . -name "*.zip" -not -path "./.git/*" | while read f; do
            unzip -o "$f" -d "${f%.zip}"
            rm "$f"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-unzip uploaded file [skip ci]"
          git push
